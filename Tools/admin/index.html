<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XNook 授权管理后台</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --border: #e3e5e9;
    --text: #1c1e21;
    --text-dim: #6b7076;
    --accent: #2563eb;
    --green: #16a34a;
    --red: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 22px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 14px; font-weight: 600; margin: 0 0 12px; }
  label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  input[type=text], input[type=password], input[type=number], select, textarea {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font: inherit;
    font-size: 13px;
    background: #fff;
  }
  button {
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #fff;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #f0f1f3; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #1d4ed8; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 120px; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; }
  .stat {
    flex: 1; min-width: 110px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .stat .n { font-size: 22px; font-weight: 600; }
  .stat .l { font-size: 12px; color: var(--text-dim); }
  .msg { padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-top: 12px; }
  .msg.ok { background: #ecfdf3; color: #15803d; border: 1px solid #bbf7d0; }
  .msg.err { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-dim); font-weight: 500; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; word-break: break-all; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 5px; font-size: 11px; }
  .badge.y { background: #ecfdf3; color: #15803d; }
  .badge.n { background: #f3f4f6; color: #6b7280; }
  .hint { font-size: 12px; color: var(--text-dim); margin-top: 6px; }
  .mono-block {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    background: #f9fafb;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px;
    max-height: 220px;
    overflow: auto;
    white-space: pre;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>XNook 授权管理后台</h1>
  <div class="sub">生成邀请码、查看台账、追踪激活情况。私钥仅在后端内存中使用，不会经由任何接口返回。</div>

  <div class="card">
    <h2>管理令牌</h2>
    <div class="row">
      <div>
        <label for="token">Bearer Token</label>
        <input type="password" id="token" placeholder="启动服务时设置的 XNOOK_ADMIN_TOKEN" autocomplete="off">
      </div>
      <div style="flex:0 0 auto">
        <button class="primary" id="btnConnect">连接</button>
      </div>
    </div>
    <div class="hint">令牌只保存在本页内存中，不写入浏览器存储。</div>
    <div id="connMsg"></div>
  </div>

  <div id="panel" style="display:none">

    <div class="stats" id="stats"></div>

    <div class="card" style="margin-top:16px">
      <h2>生成邀请码</h2>
      <div class="row">
        <div style="flex:0 0 110px">
          <label for="count">数量</label>
          <input type="number" id="count" value="10" min="1" max="1000">
        </div>
        <div style="flex:0 0 150px">
          <label for="kind">类型</label>
          <select id="kind">
            <option value="sale">销售码</option>
            <option value="early">早期支持者码</option>
            <option value="gift">人工赠码</option>
          </select>
        </div>
        <div>
          <label for="note">备注（便于日后对账）</label>
          <input type="text" id="note" placeholder="例如：淘宝首批 / 朋友赠予">
        </div>
        <div style="flex:0 0 auto">
          <button class="primary" id="btnIssue">生成</button>
        </div>
      </div>
      <div id="issueMsg"></div>
      <div id="issueOut" style="display:none; margin-top:12px">
        <div class="row" style="align-items:center">
          <div style="flex:0 0 auto"><button id="btnCopyAll">复制全部</button></div>
          <div style="flex:0 0 auto"><button id="btnDownloadCsv">下载 CSV</button></div>
          <div style="flex:1; text-align:right; color:var(--text-dim); font-size:12px" id="batchInfo"></div>
        </div>
        <div class="mono-block" id="codesOut" style="margin-top:10px"></div>
      </div>
    </div>

    <div class="card">
      <h2>查询邀请码</h2>
      <div class="row">
        <div style="flex:0 0 200px">
          <label for="lookupSerial">序列号</label>
          <input type="text" id="lookupSerial" placeholder="例如 42">
        </div>
        <div style="flex:0 0 auto"><button id="btnLookup">查询</button></div>
      </div>
      <div id="lookupMsg"></div>
      <div id="lookupOut"></div>
    </div>

    <div class="card">
      <h2>最近激活登记</h2>
      <div class="hint" style="margin-bottom:10px">
        来自 App 的首次激活上报。这里只做记录——是否放行始终由 App 本地验签决定，与服务器无关。
      </div>
      <div class="row">
        <div style="flex:0 0 auto"><button id="btnRefreshReg">刷新</button></div>
      </div>
      <div id="regOut" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <h2>历史批次</h2>
      <div id="batchOut"></div>
    </div>

  </div>
</div>

<script>
(function () {
  'use strict';

  var token = '';
  var lastBatchId = null;

  function $(id) { return document.getElementById(id); }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function showMsg(el, text, ok) {
    el.innerHTML = text
      ? '<div class="msg ' + (ok ? 'ok' : 'err') + '">' + escapeHtml(text) + '</div>'
      : '';
  }

  function api(path, options) {
    options = options || {};
    options.headers = Object.assign({ 'Authorization': 'Bearer ' + token }, options.headers || {});
    return fetch(path, options).then(function (res) {
      return res.json().then(function (data) {
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        return data;
      });
    });
  }

  function stat(n, label) {
    return '<div class="stat"><div class="n">' + n + '</div><div class="l">' + label + '</div></div>';
  }

  // ── 连接 ──
  $('btnConnect').addEventListener('click', function () {
    token = $('token').value.trim();
    if (!token) { showMsg($('connMsg'), '请输入令牌。', false); return; }

    api('/api/admin/pubkey').then(function (data) {
      showMsg($('connMsg'), '已连接。公钥指纹 ' + data.fingerprint, true);
      $('panel').style.display = 'block';
      refreshLedger();
      refreshRegistrations();
    }).catch(function (e) {
      showMsg($('connMsg'), '连接失败：' + e.message + '（请核对令牌）', false);
      $('panel').style.display = 'none';
    });
  });

  // ── 台账总览 ──
  function refreshLedger() {
    api('/api/admin/ledger').then(function (d) {
      $('stats').innerHTML =
        stat(d.total, '已生成') +
        stat(d.sold, '已标记售出') +
        stat(d.activated, '已激活') +
        stat(d.nextSerial, '下一个序列号');

      $('batchOut').innerHTML = d.batches.length === 0
        ? '<div class="hint">暂无批次。</div>'
        : '<table><thead><tr><th>批次</th><th>数量</th><th>序列号区间</th><th>备注</th><th>时间</th><th></th></tr></thead><tbody>' +
          d.batches.slice().reverse().map(function (b) {
            return '<tr><td><code>' + escapeHtml(b.id) + '</code></td>' +
              '<td>' + b.count + '</td>' +
              '<td>' + b.serialRange[0] + '–' + b.serialRange[1] + '</td>' +
              '<td>' + escapeHtml(b.note || '—') + '</td>' +
              '<td>' + escapeHtml(b.createdAt.slice(0, 19).replace('T', ' ')) + '</td>' +
              '<td><button data-export="' + escapeHtml(b.id) + '">导出</button></td></tr>';
          }).join('') + '</tbody></table>';

      Array.prototype.forEach.call($('batchOut').querySelectorAll('[data-export]'), function (btn) {
        btn.addEventListener('click', function () { downloadCsv(btn.getAttribute('data-export')); });
      });
    }).catch(function (e) { console.error(e); });
  }

  // ── 生成邀请码 ──
  $('btnIssue').addEventListener('click', function () {
    var btn = $('btnIssue');
    btn.disabled = true;
    showMsg($('issueMsg'), '', true);

    var kind = $('kind').value;
    var body = {
      count: Number($('count').value) || 1,
      note: $('note').value.trim(),
      earlySupporter: kind === 'early',
      complimentary: kind === 'gift'
    };

    api('/api/admin/issue', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (d) {
      lastBatchId = d.batchId;
      showMsg($('issueMsg'), '已生成 ' + d.codes.length + ' 个邀请码。', true);
      $('issueOut').style.display = 'block';
      $('batchInfo').textContent = '批次 ' + d.batchId;
      $('codesOut').textContent = d.codes.map(function (c) { return c.code; }).join('\n');
      refreshLedger();
    }).catch(function (e) {
      showMsg($('issueMsg'), '生成失败：' + e.message, false);
    }).finally(function () {
      btn.disabled = false;
    });
  });

  $('btnCopyAll').addEventListener('click', function () {
    navigator.clipboard.writeText($('codesOut').textContent).then(function () {
      showMsg($('issueMsg'), '已复制到剪贴板。', true);
    }).catch(function () {
      showMsg($('issueMsg'), '复制失败，请手动选中复制。', false);
    });
  });

  $('btnDownloadCsv').addEventListener('click', function () { downloadCsv(lastBatchId); });

  function downloadCsv(batchId) {
    var url = '/api/admin/export' + (batchId ? '?batch=' + encodeURIComponent(batchId) : '');
    fetch(url, { headers: { 'Authorization': 'Bearer ' + token } })
      .then(function (res) { return res.text(); })
      .then(function (csv) {
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'xnook-' + (batchId || 'all') + '.csv';
        a.click();
        URL.revokeObjectURL(a.href);
      });
  }

  // ── 查询 ──
  $('btnLookup').addEventListener('click', function () {
    var serial = $('lookupSerial').value.trim();
    if (!serial) return;

    api('/api/admin/lookup?serial=' + encodeURIComponent(serial)).then(function (d) {
      showMsg($('lookupMsg'), '', true);
      var e = d.entry;
      $('lookupOut').innerHTML =
        '<table style="margin-top:10px"><tbody>' +
        '<tr><th style="width:120px">序列号</th><td>' + e.serial + '</td></tr>' +
        '<tr><th>短编号</th><td><code>' + escapeHtml(e.shortId) + '</code></td></tr>' +
        '<tr><th>邀请码</th><td><code>' + escapeHtml(e.code) + '</code></td></tr>' +
        '<tr><th>激活链接</th><td><code>xnook://activate?code=' + escapeHtml(e.compact) + '</code></td></tr>' +
        '<tr><th>已售出</th><td><span class="badge ' + (e.sold ? 'y' : 'n') + '">' + (e.sold ? '是' : '否') + '</span></td></tr>' +
        '<tr><th>已激活</th><td>' + (e.activatedAt
          ? escapeHtml(e.activatedAt.slice(0, 19).replace('T', ' '))
          : '<span class="badge n">尚未激活</span>') + '</td></tr>' +
        '<tr><th>生成时间</th><td>' + escapeHtml(e.issuedAt.slice(0, 19).replace('T', ' ')) + '</td></tr>' +
        '<tr><th>备注</th><td>' + escapeHtml(e.note || '—') + '</td></tr>' +
        '</tbody></table>';
    }).catch(function (err) {
      showMsg($('lookupMsg'), '查询失败：' + err.message, false);
      $('lookupOut').innerHTML = '';
    });
  });

  // ── 登记记录 ──
  function refreshRegistrations() {
    api('/api/admin/registrations').then(function (d) {
      if (d.count === 0) {
        $('regOut').innerHTML = '<div class="hint">暂无激活记录。</div>';
        return;
      }
      $('regOut').innerHTML =
        '<table><thead><tr><th>序列号</th><th>短编号</th><th>平台</th><th>版本</th><th>本店签发</th><th>时间</th></tr></thead><tbody>' +
        d.records.slice().reverse().map(function (r) {
          return '<tr><td>' + r.serial + '</td>' +
            '<td><code>' + escapeHtml(r.shortId || '—') + '</code></td>' +
            '<td>' + escapeHtml(r.platform) + '</td>' +
            '<td>' + escapeHtml(r.appVersion) + '</td>' +
            '<td><span class="badge ' + (r.knownIssued ? 'y' : 'n') + '">' + (r.knownIssued ? '是' : '否') + '</span></td>' +
            '<td>' + escapeHtml(r.at.slice(0, 19).replace('T', ' ')) + '</td></tr>';
        }).join('') + '</tbody></table>';
    }).catch(function (e) { console.error(e); });
  }

  $('btnRefreshReg').addEventListener('click', refreshRegistrations);

  $('token').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') $('btnConnect').click();
  });
})();
</script>
</body>
</html>
