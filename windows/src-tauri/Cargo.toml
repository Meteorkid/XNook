[package]
name = "xnook-windows"
version = "0.3.2"
edition = "2021"
description = "Windows client for XNook"
default-run = "xnook"

[lib]
name = "xnook_windows"
path = "src/lib.rs"

[[bin]]
name = "xnook"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
island-link = { path = "../crates/island-link" }
time = { version = "0.3", features = ["parsing"] }
base64 = "0.22"
regex = "1"
unicode-normalization = "0.1"
gif = { version = "0.13.3", default-features = false, features = ["std"] }
tauri = { version = "2", features = ["macos-private-api", "tray-icon"], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Media_Control", "Storage_Streams", "Foundation"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_Storage_Packaging_Appx", "Win32_Security"] }
drag = "2.1.1"
winvd = "0.0.49"
windows-vd = { package = "windows", version = "0.58", features = ["Win32_Foundation"] }
